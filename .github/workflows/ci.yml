name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Client bundle must not contain secrets (AC-026, NFR-005)
        run: |
          if grep -rEl "DATABASE_URL|CLERK_SECRET_KEY|CLERK_WEBHOOK_SIGNING_SECRET|ANTHROPIC_API_KEY|sk-ant-" .next/static; then
            echo "::error::secret-like string found in the client bundle"; exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
